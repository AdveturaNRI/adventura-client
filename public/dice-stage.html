<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
  <link rel="dns-prefetch" href="https://cdn.jsdelivr.net" />
  <link rel="modulepreload" href="https://cdn.jsdelivr.net/npm/@3d-dice/dice-box@1.1.4/dist/dice-box.es.min.js" crossorigin />
  <link rel="modulepreload" href="https://cdn.jsdelivr.net/npm/@3d-dice/dice-box@1.1.4/dist/world.onscreen.min.js" crossorigin />
  <style>
    html, body, #dice-box {
      margin: 0;
      width: 100%;
      height: 100%;
      background: #0B1220;
      overflow: hidden;
    }
    #dice-box { position: relative; }
    #dice-box canvas { width: 100% !important; height: 100% !important; display: block; }
    html.transparent, html.transparent body, html.transparent #dice-box {
      background: transparent !important;
      pointer-events: none !important;
    }
    html.transparent #dice-box canvas { pointer-events: none !important; }
    #hint {
      position: absolute;
      left: 16px;
      right: 16px;
      bottom: 16px;
      text-align: center;
      color: rgba(255,255,255,0.55);
      font: 600 14px/1.4 -apple-system, system-ui, sans-serif;
      pointer-events: none;
      z-index: 2;
    }
    #status {
      display: none;
    }
  </style>
  <script>
    if (new URLSearchParams(location.search).get('transparent') === '1') {
      document.documentElement.classList.add('transparent');
    }
  </script>
</head>
<body>
  <div id="dice-box">
    <div id="status">Тянем 3D-движок…</div>
    <div id="hint" style="display:none"></div>
  </div>
  <script type="module">
    const VERSION = '1.1.4';
    const CDN = `https://cdn.jsdelivr.net/npm/@3d-dice/dice-box@${VERSION}/dist`;
    const statusEl = document.getElementById('status');
    const hintEl = document.getElementById('hint');

    function setStatus(text) {
      if (!statusEl) return;
      statusEl.textContent = text;
      // Parent screen owns loading copy — never paint status text here.
      post({ type: 'status', message: text });
    }

    function hideStatus() {
      // no-op: status node stays hidden on web
    }

    function post(msg) {
      const payload = JSON.stringify(msg);
      if (window.parent && window.parent !== window) {
        window.parent.postMessage(payload, '*');
      }
      if (window.ReactNativeWebView && window.ReactNativeWebView.postMessage) {
        window.ReactNativeWebView.postMessage(payload);
      }
    }

    function flatten(results, notation) {
      const groups = [];
      const values = [];
      (results || []).forEach((group) => {
        const rolls = Array.isArray(group.rolls)
          ? group.rolls.map((die) => die.value)
          : typeof group.value === 'number'
            ? [group.value]
            : [];
        rolls.forEach((v) => values.push(v));
        groups.push({
          sides: Number(group.sides) || 0,
          values: rolls,
          sum: rolls.reduce((a, b) => a + b, 0),
        });
      });
      const label = Array.isArray(notation)
        ? notation.join(' + ')
        : String(notation || '');
      return {
        values,
        sum: values.reduce((a, b) => a + b, 0),
        notation: label,
        groups,
      };
    }

    function normalizeNotation(notation) {
      if (Array.isArray(notation)) {
        return notation.filter(Boolean);
      }
      return notation || '1d20';
    }

    function isEmptyNotation(notation) {
      if (Array.isArray(notation)) return notation.length === 0;
      return !notation;
    }

    const params = new URLSearchParams(location.search);
    let currentAccent = params.get('accent') || '#157AFE';
    const transparent = params.get('transparent') === '1';

    if (transparent) {
      document.documentElement.style.background = 'transparent';
      document.body.style.background = 'transparent';
      const box = document.getElementById('dice-box');
      if (box) box.style.background = 'transparent';
      document.body.style.pointerEvents = 'none';
    }

    const ROLL_CFG = {
      throwForce: 5,
      spinForce: 5,
      startingHeight: 8,
      settleTimeout: 3500,
    };
    // Appear on the table center — no edge toss / soft-drop.
    const PREVIEW_CFG = {
      throwForce: 0,
      spinForce: 0,
      startingHeight: 1.1,
      settleTimeout: 280,
      // Physics worker uses this when newStartPoint is false.
      startPosition: [0, 1.1, 0],
    };

    setStatus('Тянем 3D-движок…');
    const DiceBox = (await import(`${CDN}/dice-box.es.min.js`)).default;

    setStatus('Собираем физику…');
    const box = new DiceBox('#dice-box', {
      origin: typeof window !== 'undefined' ? window.location.origin : '',
      // Copied from @3d-dice/dice-box package into public/dice-box (Metro blocks /assets/*)
      assetPath: '/dice-box/',
      theme: 'default',
      themeColor: currentAccent,
      scale: 6,
      gravity: 1,
      ...ROLL_CFG,
      offscreen: false,
      enableShadows: false,
      lightIntensity: 1.05,
    });

    let ready = false;
    let generation = 0;
    let busy = false;

    try {
      await box.init();
      ready = true;
      hideStatus();
      hintEl.style.display = 'none';
      post({ type: 'ready' });
    } catch (err) {
      console.error(err);
      setStatus('Не удалось загрузить кубики');
      post({ type: 'error', message: String(err && err.message || err) });
    }

    function applyAccent(next) {
      if (typeof next === 'string' && /^#[0-9A-Fa-f]{6}$/.test(next.trim())) {
        currentAccent = next.trim();
      }
      return currentAccent;
    }

    async function runPreview(notation, themeColor) {
      const token = ++generation;
      const color = applyAccent(themeColor);
      if (isEmptyNotation(notation)) {
        box.clear();
        return;
      }
      // Spawn at table center (dice-box defaults to an edge start point).
      box.updateConfig(PREVIEW_CFG);
      busy = true;
      try {
        await box.roll(normalizeNotation(notation), {
          theme: 'default',
          themeColor: color,
          // Keep our center startPosition — true would move spawn to an edge.
          newStartPoint: false,
        });
      } catch (err) {
        console.warn(err);
      } finally {
        busy = false;
        if (token === generation) {
          box.updateConfig(ROLL_CFG);
        }
      }
    }

    async function runRoll(notation, themeColor) {
      const token = ++generation;
      const color = applyAccent(themeColor);
      box.updateConfig(ROLL_CFG);
      busy = true;
      try {
        const results = await box.roll(normalizeNotation(notation), {
          theme: 'default',
          themeColor: color,
          newStartPoint: true,
        });
        if (token === generation) {
          post({ type: 'done', outcome: flatten(results, notation) });
        }
      } finally {
        busy = false;
        if (token === generation) {
          box.updateConfig(ROLL_CFG);
        }
      }
    }

    async function onMessage(raw) {
      try {
        const data = typeof raw === 'string' ? JSON.parse(raw) : raw;
        if (!data || typeof data !== 'object' || !ready) return;

        if (data.type === 'setAccent') {
          applyAccent(data.themeColor);
          return;
        }

        if (data.type === 'preview') {
          // Don't stack previews while a real roll is in flight.
          if (busy && data.force !== true) {
            // Still bump generation so an in-flight preview is ignored after.
          }
          await runPreview(data.notation, data.themeColor);
        }

        if (data.type === 'roll') {
          hintEl.style.display = 'none';
          await runRoll(data.notation ?? '1d20', data.themeColor);
        }

        if (data.type === 'clear') {
          generation += 1;
          box.clear();
          hintEl.style.display = 'none';
        }
      } catch (err) {
        post({ type: 'error', message: String(err && err.message || err) });
      }
    }

    window.addEventListener('message', (e) => onMessage(e.data));
  </script>
</body>
</html>
