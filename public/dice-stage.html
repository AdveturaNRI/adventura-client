<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <link rel="modulepreload" href="/vendor/dice-box/dice-box.es.min.js" />
  <link rel="modulepreload" href="/vendor/dice-box/world.onscreen.min.js" />
  <link rel="modulepreload" href="/vendor/dice-box/Dice.min.js" />
  <style>
    html, body, #dice-box {
      margin: 0;
      width: 100%;
      height: 100%;
      background: #0B1220;
      overflow: hidden;
    }
    #dice-box { position: relative; }
    #dice-box canvas { width: 100% !important; height: 100% !important; display: block; }
    html.transparent, html.transparent body, html.transparent #dice-box {
      background: transparent !important;
      pointer-events: none !important;
      color-scheme: normal;
    }
    html.transparent #dice-box canvas {
      pointer-events: none !important;
      background: transparent !important;
    }
    #hint {
      position: absolute;
      left: 16px;
      right: 16px;
      bottom: 16px;
      text-align: center;
      color: rgba(255,255,255,0.55);
      font: 600 14px/1.4 -apple-system, system-ui, sans-serif;
      pointer-events: none;
      z-index: 2;
    }
    #status {
      display: none;
    }
    #skin-fx {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 1;
      opacity: 0;
      transition: opacity 0.25s ease;
    }
    html.skin-aurora #dice-box canvas {
      filter: saturate(1.35) contrast(1.08) drop-shadow(0 0 18px rgba(232,195,106,0.55));
    }
    html.skin-aurora #skin-fx {
      opacity: 1;
      background:
        radial-gradient(circle at 30% 20%, rgba(232,195,106,0.22), transparent 42%),
        radial-gradient(circle at 70% 80%, rgba(57,243,255,0.16), transparent 46%);
    }
    html.skin-glitch #dice-box canvas {
      filter: saturate(1.5) hue-rotate(-8deg) drop-shadow(0 0 14px rgba(57,243,255,0.55));
    }
    html.skin-glitch #skin-fx {
      opacity: 1;
      background:
        repeating-linear-gradient(0deg, transparent, transparent 6px, rgba(57,243,255,0.08) 7px),
        radial-gradient(circle at 80% 20%, rgba(255,77,219,0.18), transparent 40%);
    }
    html.skin-obsidian #dice-box canvas {
      filter: saturate(1.2) contrast(1.12) drop-shadow(0 0 16px rgba(124,58,237,0.6));
    }
    html.skin-obsidian #skin-fx {
      opacity: 1;
      background:
        radial-gradient(circle at 50% 80%, rgba(124,58,237,0.28), transparent 50%),
        radial-gradient(circle at 20% 20%, rgba(245,208,254,0.12), transparent 36%);
    }
    html.skin-oak #dice-box canvas {
      filter: saturate(1.18) sepia(0.16) contrast(1.06) drop-shadow(0 0 16px rgba(196,122,58,0.55));
    }
    html.skin-oak #skin-fx {
      opacity: 1;
      background:
        radial-gradient(circle at 50% 86%, rgba(196,122,58,0.3), transparent 50%),
        radial-gradient(circle at 22% 18%, rgba(246,226,179,0.16), transparent 34%),
        repeating-linear-gradient(92deg, transparent 0 11px, rgba(90,50,20,0.08) 12px);
    }
    html.skin-crit #skin-fx::after {
      content: '';
      position: absolute;
      inset: 18%;
      border-radius: 50%;
      border: 2px solid rgba(255, 241, 194, 0.85);
      box-shadow: 0 0 40px rgba(232, 195, 106, 0.55);
      animation: skin-crit-ring 0.9s ease-out forwards;
    }
    @keyframes skin-crit-ring {
      from { transform: scale(0.4); opacity: 1; }
      to { transform: scale(1.8); opacity: 0; }
    }
  </style>
  <script>
    if (new URLSearchParams(location.search).get('transparent') === '1') {
      document.documentElement.classList.add('transparent');
    }
  </script>
</head>
<body>
  <div id="dice-box">
    <div id="status">Тянем 3D-движок…</div>
    <div id="hint" style="display:none"></div>
    <div id="skin-fx"></div>
  </div>
  <script type="module">
    // Только локальные модули — CDN modulepreload на телефоне в LAN даёт
    // «Importing a module script failed».
    import DiceBox from '/vendor/dice-box/dice-box.es.min.js';

    const statusEl = document.getElementById('status');
    const hintEl = document.getElementById('hint');

    function setStatus(text) {
      if (!statusEl) return;
      statusEl.textContent = text;
      // Parent screen owns loading copy — never paint status text here.
      post({ type: 'status', message: text });
    }

    function hideStatus() {
      // no-op: status node stays hidden on web
    }

    function post(msg) {
      const payload = JSON.stringify(msg);
      if (window.parent && window.parent !== window) {
        window.parent.postMessage(payload, '*');
      }
      if (window.ReactNativeWebView && window.ReactNativeWebView.postMessage) {
        window.ReactNativeWebView.postMessage(payload);
      }
    }

    function flatten(results, notation) {
      const groups = [];
      const values = [];
      (results || []).forEach((group) => {
        const rolls = Array.isArray(group.rolls)
          ? group.rolls.map((die) => die.value)
          : typeof group.value === 'number'
            ? [group.value]
            : [];
        rolls.forEach((v) => values.push(v));
        groups.push({
          sides: Number(String(group.sides).replace(/^d/i, '')) || 0,
          values: rolls,
          sum: rolls.reduce((a, b) => a + b, 0),
        });
      });
      const label = Array.isArray(notation)
        ? notation
            .map((part) =>
              typeof part === 'string'
                ? part
                : part && typeof part === 'object'
                  ? `${part.qty ?? 1}d${part.sides}`
                  : String(part),
            )
            .join(' + ')
        : typeof notation === 'object' && notation
          ? `${notation.qty ?? 1}d${notation.sides}`
          : String(notation || '');
      return {
        values,
        sum: values.reduce((a, b) => a + b, 0),
        notation: label,
        groups,
      };
    }

    function normalizeNotation(notation) {
      if (Array.isArray(notation)) {
        return notation.filter(Boolean);
      }
      return notation || '1d20';
    }

    function isEmptyNotation(notation) {
      if (Array.isArray(notation)) return notation.length === 0;
      return !notation;
    }

    const params = new URLSearchParams(location.search);
    let currentAccent = params.get('accent') || '#157AFE';
    const transparent = params.get('transparent') === '1';
    const parsedScale = Number(params.get('scale'));
    const dieScale = Number.isFinite(parsedScale) && parsedScale > 0 ? parsedScale : 6;
    const forceCenter = params.get('center') === '1';

    if (transparent) {
      document.documentElement.style.background = 'transparent';
      document.body.style.background = 'transparent';
      const boxEl = document.getElementById('dice-box');
      if (boxEl) boxEl.style.background = 'transparent';
      document.body.style.pointerEvents = 'none';
    }

    const ROLL_CFG_NORMAL = {
      throwForce: 5,
      spinForce: 5,
      startingHeight: 8,
      settleTimeout: 3500,
      gravity: 1,
    };
    const ROLL_CFG_FAST = {
      throwForce: 4,
      spinForce: 3,
      startingHeight: 5,
      settleTimeout: 1400,
      gravity: 2.6,
    };
    // Appear on the table center — no edge toss / soft-drop.
    const PREVIEW_CFG = {
      throwForce: 0,
      spinForce: 0,
      startingHeight: 1.1,
      settleTimeout: 280,
      gravity: 1,
      // Physics worker uses this when newStartPoint is false.
      startPosition: [0, 1.1, 0],
    };
    const CENTER_ROLL_CFG = {
      throwForce: 3.2,
      spinForce: 3.4,
      startingHeight: 3.4,
      settleTimeout: 1600,
      gravity: 2.1,
      startPosition: [0, 3.4, 0],
    };

    let currentSpeed = 'normal';
    function rollCfgForSpeed(speed) {
      return speed === 'fast' ? ROLL_CFG_FAST : ROLL_CFG_NORMAL;
    }

    setStatus('Собираем физику…');
    const box = new DiceBox('#dice-box', {
      origin: typeof window !== 'undefined' ? window.location.origin : '',
      // Copied from @3d-dice/dice-box package into public/dice-box (Metro blocks /assets/*)
      assetPath: '/dice-box/',
      theme: 'default',
      themeColor: currentAccent,
      scale: dieScale,
      ...rollCfgForSpeed(currentSpeed),
      offscreen: false,
      enableShadows: false,
      lightIntensity: 1.05,
    });

    let ready = false;
    let generation = 0;
    let busy = false;

    try {
      await box.init();
      ready = true;
      hideStatus();
      hintEl.style.display = 'none';
      post({ type: 'ready' });
    } catch (err) {
      console.error(err);
      setStatus('Не удалось загрузить кубики');
      post({ type: 'error', message: String(err && err.message || err) });
    }

    function applyAccent(next) {
      if (typeof next === 'string' && /^#[0-9A-Fa-f]{6}$/.test(next.trim())) {
        currentAccent = next.trim();
      }
      return currentAccent;
    }

    const SKIN_CLASS = {
      alpha_pioneer: 'skin-aurora',
      neon_glitch: 'skin-glitch',
      founding_obsidian: 'skin-obsidian',
      tavern_oak: 'skin-oak',
    };
    function applySkin(next) {
      const root = document.documentElement;
      root.classList.remove('skin-aurora', 'skin-glitch', 'skin-obsidian', 'skin-oak', 'skin-crit');
      const cls = SKIN_CLASS[next];
      if (cls) root.classList.add(cls);
      return next;
    }
    function flashCrit(results) {
      const values = [];
      (results || []).forEach((group) => {
        const rolls = Array.isArray(group.rolls)
          ? group.rolls.map((d) => d.value)
          : typeof group.value === 'number'
            ? [group.value]
            : [];
        rolls.forEach((v) => values.push(v));
      });
      const nat20 = values.some((v) => v === 20);
      if (!nat20) return;
      document.documentElement.classList.add('skin-crit');
      setTimeout(() => document.documentElement.classList.remove('skin-crit'), 900);
    }

    async function runPreview(notation, themeColor, skin) {
      const token = ++generation;
      const color = applyAccent(themeColor);
      applySkin(skin);
      if (isEmptyNotation(notation)) {
        box.clear();
        return;
      }
      // Spawn at table center (dice-box defaults to an edge start point).
      box.updateConfig(PREVIEW_CFG);
      busy = true;
      try {
        await box.roll(normalizeNotation(notation), {
          theme: 'default',
          themeColor: color,
          // Keep our center startPosition — true would move spawn to an edge.
          newStartPoint: false,
        });
      } catch (err) {
        console.warn(err);
      } finally {
        busy = false;
        if (token === generation) {
          box.updateConfig(rollCfgForSpeed(currentSpeed));
        }
      }
    }

    async function runRoll(notation, themeColor, speed, skin, center) {
      const token = ++generation;
      const color = applyAccent(themeColor);
      applySkin(skin);
      if (speed === 'fast' || speed === 'normal') {
        currentSpeed = speed;
      }
      const centered = center === true || forceCenter;
      const rollCfg = centered ? CENTER_ROLL_CFG : rollCfgForSpeed(currentSpeed);
      box.updateConfig(rollCfg);
      busy = true;
      try {
        const results = await box.roll(normalizeNotation(notation), {
          theme: 'default',
          themeColor: color,
          newStartPoint: !centered,
        });
        if (token === generation) {
          flashCrit(results);
          post({ type: 'done', outcome: flatten(results, notation) });
        }
      } finally {
        busy = false;
        if (token === generation) {
          box.updateConfig(centered ? CENTER_ROLL_CFG : rollCfgForSpeed(currentSpeed));
        }
      }
    }

    function parseHostMessage(raw) {
      if (raw == null) return null;
      if (typeof raw === 'object') {
        return typeof raw.type === 'string' ? raw : null;
      }
      if (typeof raw !== 'string') return null;
      const trimmed = raw.trim();
      if (!trimmed.startsWith('{')) return null;
      try {
        const data = JSON.parse(trimmed);
        return data && typeof data === 'object' && typeof data.type === 'string'
          ? data
          : null;
      } catch {
        return null;
      }
    }

    async function onMessage(raw) {
      const data = parseHostMessage(raw);
      if (!data || !ready) return;

      try {
        if (data.type === 'setAccent') {
          applyAccent(data.themeColor);
          return;
        }

        if (data.type === 'setSpeed') {
          if (data.speed === 'fast' || data.speed === 'normal') {
            currentSpeed = data.speed;
            if (!busy) {
              box.updateConfig(rollCfgForSpeed(currentSpeed));
            }
          }
          return;
        }

        if (data.type === 'ping') {
          if (ready) post({ type: 'ready' });
          return;
        }

        if (data.type === 'resize') {
          try {
            box?.resize?.();
          } catch {
            // ignore
          }
          return;
        }

        if (data.type === 'preview') {
          // Don't stack previews while a real roll is in flight.
          if (busy && data.force !== true) {
            // Still bump generation so an in-flight preview is ignored after.
          }
          await runPreview(data.notation, data.themeColor, data.skin);
          return;
        }

        if (data.type === 'roll') {
          hintEl.style.display = 'none';
          await runRoll(data.notation ?? '1d20', data.themeColor, data.speed, data.skin, data.center);
          return;
        }

        if (data.type === 'clear') {
          generation += 1;
          box.clear();
          hintEl.style.display = 'none';
        }
      } catch (err) {
        post({ type: 'error', message: String(err && err.message || err) });
      }
    }

    window.addEventListener('message', (e) => onMessage(e.data));
  </script>
</body>
</html>
