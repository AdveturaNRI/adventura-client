<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>Adventura</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #111827; color: #f3f4f6; font: 14px system-ui, sans-serif; cursor: pointer; }
    main { height: 108px; padding: 16px 12px 16px 18px; border: 1px solid #374151; display: flex; gap: 12px; }
    img { width: 36px; height: 36px; border-radius: 8px; }
    section { min-width: 0; flex: 1; }
    button { flex: 0 0 26px; height: 26px; border: 0; border-radius: 6px; background: transparent; color: #cbd5e1; font-size: 20px; cursor: pointer; }
    button:hover { background: #374151; color: white; }
    strong { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    p { margin: 7px 0 0; color: #cbd5e1; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow-wrap: anywhere; }
  </style>
</head>
<body><main><img src="build/icon.png" alt=""><section><strong id="title"></strong><p id="body"></p></section><button id="dismiss" type="button" aria-label="Закрыть уведомление" title="Закрыть">×</button></main>
<script>
  window.adventuraNotification.onContent((content) => {
    document.getElementById('title').textContent = content.title;
    document.getElementById('body').textContent = content.body;
  });
  document.addEventListener('click', () => window.adventuraNotification.click());
  document.getElementById('dismiss').addEventListener('click', (event) => { event.stopPropagation(); window.adventuraNotification.dismiss(); });
</script></body>
</html>
